name: Build JCOW407 OpenWrt
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-distutils-extra rsync unzip zlib1g-dev file wget python3-setuptools python3-dev libelf-dev ecj fastjar python3-full

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 -b main https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          echo "src-git packages https://git.openwrt.org/feed/packages.git" >> feeds.conf.default
          echo "src-git luci https://git.openwrt.org/project/luci.git" >> feeds.conf.default
          echo "src-git routing https://git.openwrt.org/feed/routing.git" >> feeds.conf.default
          echo "src-git telephony https://git.openwrt.org/feed/telephony.git" >> feeds.conf.default

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for JCOW407
        run: |
          cd openwrt
          echo 'CONFIG_TARGET_econet=y' > .config
          echo 'CONFIG_TARGET_econet_en7528=y' >> .config
          echo 'CONFIG_TARGET_econet_en7528_DEVICE_jiofiber_jcow407=y' >> .config
          echo 'CONFIG_PACKAGE_ca-bundle=y' >> .config
          echo 'CONFIG_PACKAGE_openssl-util=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-ssl=y' >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jcow407-firmware
          path: openwrt/bin/targets/econet/en7528/*factory*.trx,openwrt/bin/targets/econet/en7528/*sysupgrade*.bin
          retention-days: 7

      - name: Show output
        run: |
          cd openwrt
          ls -la bin/targets/econet/en7528/