name: Build JCOW407 GPON

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-full rsync unzip zlib1g-dev file wget python3-setuptools python3-dev libelf-dev ecj fastjar

      - name: Build firmware
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Find firmware files
        run: |
          find . -name "*.trx" -o -name "*factory*.bin" -o -name "*sysupgrade*.bin" | head -20

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jcow407-gpon-firmware
          path: openwrt/bin/targets/**/*
          retention-days: 7
